name: Deploy
run-name: Deploy to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Environment
        default: staging
        options: [production, staging]
      deployment:
        type: environment
        description: Deployment configuration
        required: true
      replicas:
        type: choice
        description: Replicas
        default: '0'
        options: ['0', '1']
      build-image:
        type: boolean
        description: Build a new image
        default: false

permissions:
  contents: read

concurrency:
  group: minecraft-${{ inputs.deployment }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment }}
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Select image
        env:
          BUILD_IMAGE: ${{ inputs.build-image }}
          DEPLOY_IMAGE: ${{ vars.DEPLOY_IMAGE }}
          REGISTRY: ${{ vars.DOCKER_REGISTRY }}
        run: |
          if [[ "$BUILD_IMAGE" == true ]]; then
            image="$REGISTRY/library/svc-minecraft:$GITHUB_SHA"
          else
            image="$DEPLOY_IMAGE"
          fi
          [[ "$image" =~ ^[a-zA-Z0-9][a-zA-Z0-9._:/@-]+$ ]] || { printf 'An explicit image is required\n' >&2; exit 1; }
          printf 'IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        if: inputs.build-image
      - uses: docker/login-action@v3
        if: inputs.build-image
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        if: inputs.build-image
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
      - name: Deploy
        uses: WyriHaximus/github-action-helm3@v3
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REPLICAS: ${{ inputs.replicas }}
          DEPLOY_VALUES: ${{ vars.DEPLOY_VALUES || '{}' }}
          NAMESPACE: ${{ inputs.environment == 'production' && 'svc-minecraft' || 'svc-minecraft-staging' }}
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}
          overrule_existing_kubeconfig: 'true'
          exec: |
            set -eu
            umask 077
            values="$RUNNER_TEMP/deployment-values.json"
            trap 'rm -f "$values"' EXIT
            printf '%s' "$DEPLOY_VALUES" > "$values"
            command kubectl config current-context
            helm upgrade --install --wait --timeout 15m --namespace "$NAMESPACE" \
              --values "values-$ENVIRONMENT.yaml" --values "$values" \
              --set "replicas=$REPLICAS" --set-string "image=$IMAGE" \
              svc-minecraft ./chart

image: docker.home.valente.ar/svc-minecraft
port: 25565
replicas: 0
dynmap:
  enabled: true
  port: 8123
podOptions: {}
service:
  type: LoadBalancer
  annotations: {}
  loadBalancerClass: ""
  loadBalancerIP: ""
  allocateLoadBalancerNodePorts: true

cmd: java -Xms1G -Xmx1G -jar /app/paper*.jar nogui
environment: staging

pvc:
  storage: 5Gi
  existingClaim: ""
  storageClassName: ""

resources:
  requests:
    memory: "1Gi"
  limits:
    memory: "1.5Gi"

prometheus:
  enabled: false
  path: /metrics
  port: 9940

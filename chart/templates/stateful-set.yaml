apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- with .Values.podOptions }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: {{ .Release.Name }}
        image: {{ .Values.image }}
        imagePullPolicy: Always
        tty: true
        stdin: true
        ports:
          - name: app
            containerPort: {{ .Values.port }}
          - name: prometheus
            containerPort: {{ .Values.prometheus.port }}
        volumeMounts:
        - name: data
          mountPath: /app-data
        resources:
          requests:
            memory: {{ .Values.resources.requests.memory }}
          limits:
            memory: {{ .Values.resources.limits.memory }}
        env:
        - name: CMD
          value: {{ .Values.cmd }}
        - name: ENVIRONMENT
          value: {{ .Values.environment }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default .Release.Name .Values.pvc.existingClaim }}
